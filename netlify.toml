[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

# Route API endpoints directly to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/.netlify/functions/api/dashboard"
  status = 200

[[redirects]]
  from = "/patients/*"
  to = "/.netlify/functions/api/patients/:splat"
  status = 200

[[redirects]]
  from = "/patients"
  to = "/.netlify/functions/api/patients"
  status = 200

